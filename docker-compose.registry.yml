# Production: pull a pre-built linux/amd64 image from a registry and run it.
#
# On the VPS, from the deploy directory (needs ./nginx/ and a .env file):
#   docker compose -f docker-compose.registry.yml pull
#   docker compose -f docker-compose.registry.yml up -d
#
# First-time deploy: run migrations before `up -d` — see DEPLOY.md.
# DOCKER_IMAGE must be set in .env or exported in the shell.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payload}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payload}
      POSTGRES_DB: ${POSTGRES_DB:-journalism}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  app:
    image: ${DOCKER_IMAGE}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Overrides any DATABASE_URL in .env — always uses the internal service name.
      DATABASE_URL: postgres://${POSTGRES_USER:-payload}:${POSTGRES_PASSWORD:-payload}@postgres:5432/${POSTGRES_DB:-journalism}
      NODE_ENV: production
      NEXT_PUBLIC_SERVER_URL: https://sadiasinsights.co.uk
    volumes:
      - media_uploads:/app/public/media
    expose:
      - '3000'
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - internal

volumes:
  postgres_data:
  media_uploads:

networks:
  internal:
